name: Bug
description: Something does not behave as the spec says
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected (cite the spec or acceptance test) }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Actual }
    validations: { required: true }
