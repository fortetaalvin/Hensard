name: Licence check
# Week 11: fail if a dependency's licence is not on the allow-list in GOVERNANCE.md.
on:
  pull_request:
    paths: ["pyproject.toml", "requirements*.txt"]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e . pip-licenses
      - name: Check licences
        run: >
          pip-licenses --partial-match
          --allow-only="MIT;BSD;Apache;ISC;Python Software Foundation;PSF;Mozilla Public License 2.0;Unlicense"
          --ignore-packages app pip-licenses
