name: Scheduled agent (L3)
# Week 10. An unattended agent with the five controls the course requires:
#   budget    -> AGENT_MAX_TURNS and timeout-minutes
#   scope     -> the task file it is given, plus the hooks and permissions in .claude/
#   kill switch -> repository variable AGENT_ENABLED; set it to anything but "true" (or disable this workflow)
#   log       -> the transcript and summary are uploaded as artifacts on every run
#   reader    -> the "agent-approval" environment: a named human must approve each run before it starts
# Setup: Settings > Environments > New environment "agent-approval" > Required reviewers (the Operator).
#        Settings > Secrets and variables > Actions: secret AGENT_API_KEY; variables AGENT_ENABLED, AGENT_CMD, AGENT_MAX_TURNS.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task file to run, e.g. tasks/020-triage-new-issues.md"
        required: true
  # Uncomment once the gated manual runs have worked:
  # schedule:
  #   - cron: "23 4 * * 1-5"   # 05:23 Lagos time, weekdays
concurrency: { group: scheduled-agent, cancel-in-progress: false }
permissions: { contents: write, pull-requests: write }
jobs:
  run:
    if: vars.AGENT_ENABLED == 'true'
    environment: agent-approval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TASK: ${{ inputs.task || 'tasks/020-scheduled.md' }}
      AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -e ".[dev]"
      - name: Create a branch for this run
        run: |
          git config user.name "scheduled-agent"; git config user.email "scheduled-agent@users.noreply.github.com"
          git switch -c "agent/run-${{ github.run_id }}"
      - name: Run the agent on the task (budgeted)
        env:
          AGENT_CMD: ${{ vars.AGENT_CMD }}
          AGENT_MAX_TURNS: ${{ vars.AGENT_MAX_TURNS || '30' }}
        run: |
          # AGENT_CMD is the harness's headless command; it receives the prompt on stdin.
          # Example for a terminal agent with a print mode: 'claude -p --max-turns $AGENT_MAX_TURNS --output-format json'
          test -n "$AGENT_CMD" || { echo "Set the AGENT_CMD repository variable"; exit 1; }
          mkdir -p reports
          { echo "Follow AGENTS.md. Do exactly the task in $TASK and nothing else. Stop when its done-when is met."; cat "$TASK"; } \
            | bash -c "$AGENT_CMD" | tee reports/agent-output.json
      - name: Verify before proposing anything
        run: ruff check . && pytest -q
      - name: Open a pull request (never merges)
        run: |
          git add -A
          git diff --cached --quiet && { echo "No changes."; exit 0; }
          git commit -m "Scheduled agent: $TASK (run ${{ github.run_id }})"
          git push -u origin HEAD
          gh pr create --draft --title "Scheduled agent: $TASK" \
            --body "Autonomy: L3 within gates. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Transcript in the run's artifacts."
      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-run-${{ github.run_id }}
          path: reports/
