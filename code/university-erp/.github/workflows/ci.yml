name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Core and module tests
        run: pytest -q -m "not acceptance" --junitxml=reports/unit.xml
      - name: Acceptance tests (every module's spec)
        run: pytest -q -m acceptance --junitxml=reports/acceptance.xml || [ $? -eq 5 ]   # 5 = none collected yet
      - name: Audit chain and seed smoke test
        run: ERP_DB=/tmp/ci.db flask --app erp.app seed --students 2 && ERP_DB=/tmp/ci.db flask --app erp.app verify-audit
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: test-reports, path: reports/ }
