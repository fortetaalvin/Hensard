name: Evals
# Reruns the harness eval suite whenever agent configuration changes.
# Without the AGENT_API_KEY secret it runs in dry-run mode (validates the tasks only).
on:
  pull_request:
    paths: ["AGENTS.md", "CLAUDE.md", ".claude/**", "evals/**", ".mcp.json"]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -e ".[dev]"
      - name: Run evals
        env:
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          EVAL_AGENT_CMD: ${{ vars.EVAL_AGENT_CMD }}
        run: |
          if [ -n "$AGENT_API_KEY" ] && [ -n "$EVAL_AGENT_CMD" ]; then
            python evals/run_evals.py --out reports/evals.md
          else
            python evals/run_evals.py --dry-run --out reports/evals.md
          fi
          cat reports/evals.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-results, path: reports/ }
