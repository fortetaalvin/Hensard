<!doctype html><html><head><meta charset="utf-8"><title>{{ inst.short_name if inst else 'ERP' }} ERP</title>
<style>body{font-family:system-ui,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;color:#1B2A24}
header{display:flex;justify-content:space-between;align-items:center}a{color:#155E46}.flash{color:#B23A3A}</style></head>
<body><header><h1>{{ inst.name if inst else 'University' }} ERP</h1>{% if g.user %}<form method="post" action="{{ url_for('auth.logout') }}">
{{ g.user.full_name }} <button>Log out</button></form>{% endif %}</header>
{% for m in get_flashed_messages() %}<p class="flash">{{ m }}</p>{% endfor %}{% block body %}{% endblock %}</body></html>
